<div>
  <header class="sheet-header">
      <img src="{{item.img}}" data-edit="img" data-action="editImage" title="{{item.name}}"/>
      <div class="header-fields">
          <h1 class="charname"><input name="name" type="text" value="{{item.name}}" placeholder="{{localize 'BITD.System'}}"/></h1>
      </div>
  </header>

  <section class="flex-vertical">
    <div class="flex-vertical">
      <div class="label-stripe">{{localize "BITD.Description"}}</div>
      <prose-mirror name="system.description" value="{{system.description}}" toggled{{#unless editable}} disabled{{/unless}}>{{{enrichedDescription}}}</prose-mirror>
    </div>
    <div class="flex-vertical">
      <div class="label-stripe">{{localize "BITD.Notables"}}</div>
      <prose-mirror name="system.notables" value="{{system.notables}}" toggled{{#unless editable}} disabled{{/unless}}>{{{enrichedNotables}}}</prose-mirror>
    </div>
  </section>

</div>
