<form class="{{cssClass}} scum-and-villainy clock-form" autocomplete="off">
{{#if editable}}
  <div class="clock-name editable">
    <input name="name" value="{{actor.name}}" />
  </div>
{{else}}
  <div class="clock-name">
    <input name="name" value="{{actor.name}}" readonly/>
  </div>
{{/if}}
  <div class="clock-image">
    {{{sav-clock "flags.scum-and-villainy.clocks.progress" clock.size clock.progress actor.id clock.theme}}}
  </div>
{{#if editable}}
  <div class="clock-config">
    <div class="clock-config-group theme">
      <label for="theme"><i class="fa fa-palette"></i></label>
      <select name="theme">
        {{selectOptions clock.settings.themes selected=clock.theme}}
      </select>
    </div>
    <div class="clock-config-group">
      <label for="size"><i class="fa fa-chart-pie"></i></label>
      <select name="size">
        {{selectOptions clock.settings.sizes selected=clock.size}}
      </select>
    </div>
  </div>
{{/if}}
</form>
