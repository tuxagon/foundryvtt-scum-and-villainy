    text:
      format: 1
      content: >-
        <p>An alien or Way creature finds its way on board. Acquire the services
        of a mystic or exterminator to destroy or banish it, or deal with it
        yourself.</p>

        <p>Treat the magnitude (see page 278) of the Way creature as equal to
        the crew’s <strong>Wanted Level</strong> in the system. Parasites, cargo
        you weren’t told was alive, strange creatures hiding in unmapped lanes,
        and bizarre physics effects from using your jump drives way past
        capacity can all apply here.</p>
