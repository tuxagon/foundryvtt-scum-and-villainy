    text:
      format: 1
      content: >-
        <p>Warship!</p>

        <p>The Governor sends a Legion or Malklaith warship to capture your
        ship. When you hit <strong>Wanted Level</strong> 4 in a system, the
        Governor’s personal guard is sent out to bring you to justice, and you
        will have to find a way to get away. You cannot bribe them, and fighting
        them would be foolhardy. In any case, if you survive the encounter, your
        <strong>Wanted Level</strong> drops by 1 (resources for your pursuit
        aren’t infinite).</p>

        <p>Generally the ship will be a well-armed frigate with a few personal
        fighters. You may want to consider repainting or modifying your ship, or
        getting fake papers and transponders to help shake similar experiences
        off your tail.</p>
