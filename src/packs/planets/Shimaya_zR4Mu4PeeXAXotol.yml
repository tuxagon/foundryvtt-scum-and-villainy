system:
  description: >-
    This desert planet is ravaged by electrical storms that occasionally clear
    colored sand off mineral deposits essential to space travel, or turn it to
    glass, giving a view to the ruins beneath. There is a substantial civilian
    population, including the sector's preeminent educational institution,
    Khalud Academy.
