  notables: >-
    <p>Hondo Suzuka: An HNN reporter looking for evidence of conspiracy at
    Khalud Academy, where several top students have vanished. (ambitious,
    vigilant, charming)</p>

    <p>Ed Ursis: Guild Engineer that works on the orbital array and the
    electrostatic generators it powers them to keep the storms away from the
    capital. Collects colored glass statues. (dedicated, brilliant,
    overworked)</p>

    <p>Miranda Kasur: Minerals trader with a load of stolen goods she needs to
    move. In hiding after her first deal went wrong. (scared, cunning,
    proud)</p>

    <p>Sahar: Strange-suited mystic that lives in the desert. (odd, blue-eyed,
    ancient)</p>
