  scene: >-
    Cold clacking of footsteps on the brilliantly clean main concourse. Quiet
    whispers of politicos taking tea at a parlor. Children running down halls,
    laughing. The hum of generators in the darkened side passages leading to the
    lower levels. Dingy workers shouting in the cramped quarters of the mining
    rigs.
  notables: >-
    <p>Yast Jor: Guilder head of the outpost. Jor is known for getting things
    done, even if it means bending the rules. A bit of a thrill-seeker, he keeps
    a Guild-enhanced racing ship for rare days off. (commanding, shrewd,
    bold)</p>

    <p>Kasumi Ortcutt: A mystic who claims to hear the voice of Vet, the gas
    giant the platform is mining. Trades information, including esoterica on the
    Ur. (passionate, strange, religious)</p>

    <p>Espa "Bolt" Wu: Labor organizer for the Guilder miners. Rabble-rouser
    beloved by the workers. Has been incarcerated numerous times for crimes both
    real and fabricated. (popular, dissident, ambitious)</p>
  rule: >-
    Engagement rolls are at -1d due to ever-present station monitoring. Any jobs
    run against Guilders are considered on hostile turf.
