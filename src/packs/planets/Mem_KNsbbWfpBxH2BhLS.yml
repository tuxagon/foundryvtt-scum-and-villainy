system:
  description: >-
    This ocean planet was colonized by the Hegemony for almost a hundred years
    before aquatic xenos made themselves (and their planetary claims) known.
    Hegemonic forces broke the Memish military and incorporated them into the
    Hegemony. Exploration of Mem has proven difficult because of the
    free-standing gravity wells deep beneath the waves.
