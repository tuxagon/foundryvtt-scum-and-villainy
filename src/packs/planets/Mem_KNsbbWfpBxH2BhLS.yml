  scene: >-
    Hegemonic officials in sashes, talking with Memish labor bosses. See-through
    spires rising from the underwater government palace to open-air pavilions.
    Tourists embarking on submersibles to take in the local sea life. Scientists
    in exo-suits on deep-sea missions while the Memish watch from the waters.
  notables: >-
    <p>Victor Kromyl: Planetary Governor. Seeks proof of Memish rebellion after
    a few subordinates vanished. Always with his Legion bodyguard. (vigilant,
    meticulous, paranoid)</p>

    <p>Espa Nur: Memish labor boss. His scars are packed with deep-ocean
    bioluminescence. Reports to Kromyl on seditious behaviour, but hides his
    knowledge of Memish occultism. (xeno, ambitious, cunning, treacherous)</p>

    <p>Wyndam Zahn: Biology researcher seeking a connection between the Mem and
    other planetary life, with little success. Gathering an exploration of the
    ancient Mem city of Bok-Dar. (wealthy, brilliant, passionate)</p>
  rule: >-
