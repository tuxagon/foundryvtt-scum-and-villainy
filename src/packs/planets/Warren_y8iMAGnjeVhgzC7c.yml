  notables: >-
    <p>Ritam al'Malklaith: Governor of the Rin system, but in disgrace within
    House Malklaith. He seeks to improve his position in the House by acquiring
    illegal Ur artifacts. (callous, ambitious, strange)</p>

    <p>Liara Curia: Owner and operator of the Lock Luna, the most infamous bar
    in the undercity. (cunning, unforgiving, popular)</p>

    <p>Rocco Apple: Ship designer extraordinaire. Only makes one of each ship
    designed. (artistic, brilliant, aloof)</p>

    <p>Pasha Qu'olin: Once a feared assassin among the Knives, now a cunning
    Syndicate leader. Loves good food and pit fights. (sly, corpulent,
    sartorial, decadent)</p>
  rule: >-
