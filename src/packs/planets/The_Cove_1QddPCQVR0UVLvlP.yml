  scene: >-
    Quick bets taken on an open brawl between two captains over slights.
    Blue-white sparks of maintenance workers welding on a new ship. Fresh water
    misting over rows of hydroponics. A station-wide broadcast of the Banshee's
    latest conquest, followed by cheers throughout the halls.
  notables: >-
    <p>Pirate Queen Alanda "The Banshee" Ryle: Tough and violent, she enforces a
    pirate code on those who would follow her. Once stranded a first lieutenant
    on a barren world for mutiny. (proud, demanding, honorable)</p>

    <p>Praxis Ivanov: Merchant always willing to make a deal. His tentacles are
    tattooed with the story of his several-hundred-year life. (xeno,
    experienced, shrewd, loves to barter)</p>

    <p>Kai Quag: Mid-level Cobalt boss. Arranges protection for Cobalt smuggling
    runs and meets with potential clients at the Cove. (cautious, charming,
    confident)</p>
  rule: >-
    Conflicts are rampant, but by Banshee's decree, no murder is allowed. Those
    needing to settle blood feuds resort to kidnapping and killing folks
    elsewhere.
