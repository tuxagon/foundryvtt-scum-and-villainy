  scene: >-
    Heavily armed guards patrolling the tall walls of Base Camp One, nervously
    eyeing the jungle. Research crews packing for their next expedition across
    from poachers doing the same. A smuggler discussing arrangements with a
    client in a tent while a personal barista makes them drinks.
  notables: >-
    <p>Razor: A hunter mounting an expedition to catch the deadly Grand
    Phereniki for a rich client. (callous, experienced, gambler)</p>

    <p>Zokar Pava: Lost Legionnaire dealing in military-grade weapons.
    (cautious, meticulous, dissident)</p>

    <p>Intal Brel: Psy-blade-wielding Concordiat Knight. Travels with a
    nine-foot-tall xeno, an ex-priest, and an Urbot. Recently lost a party
    member and hopes to replace them. (religious, vigilant, honorable)</p>

    <p>Asha Ravann: Base Camp One commander. Instituted a wall-mounted
    flamethrower measure that's kept the jungle at bay. (tired, jaded,
    relentless)</p>
  rule: >-
    Nobody comes here who doesn't have to. The planet hates you and jobs are
    hard to find. Even bounty hunters pass it by. When you Lay Low, take +1d.
