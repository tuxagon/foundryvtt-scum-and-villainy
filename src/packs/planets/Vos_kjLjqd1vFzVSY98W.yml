  system: Holt
  scene: >-
    A well-armed, permanent blockade in space, with many ships waiting for
    clearance. Smooth walls of dense carbon brick, looking out onto the black
    surface. Diamond-scarred and sooty-faced miners, drinking by their bulky
    sonic cutters. Chiming music floating out from the pristine shops of the
    visitor settlement.
  notables: >-
    <p>Morek and Ra-na: Most-feared bounty hunter in the sector. Ra-na, his AI
    partner, helms his artifact ship and runs ops on his missions via the
    strange armor he wears. On retainer to hunt any who loot Vos. (ruthless,
    vigilant, commanding)</p>

    <p>Impera Evazan: High-ranking Guild logistics officer, responsible for
    crystal mining. Privy to much of the Guild's supply structure. (popular,
    demanding, shrewd)</p>

    <p>Yola Sprekk: Jeweler known for using the unique properties of Vos
    crystals. Her creations may be the most artful pieces in Procyon. A Sprekk
    piece can open doors in the most elite circles. (artistic, charming,
    proud)</p>
  rule: >-
    Vos is full of money, but also closely monitored by the Guild. When you do a
    job on Vos, you get +1 Cred and +1 Heat.
