  scene: >-
    A purple and green aurora shining over the freezing cold sky. Ice explorers
    whispering about the Yaru creche. Heated vapors escaping around Solitude
    Colony. Colonists in full parkas, riding large, many-eyed canids. Farmers
    pulling gas-eels and ice-mushroom wine crates in sail-sporting snow
    skimmers.
  notables: >-
    <p>Asha Munzen: Ex-lover of the Governor, ice climber, mystic, and frequent
    explorer of the ice palaces and gas caves. Only returns with visions, never
    artifacts. Attempting to find the "First Message." (mystic, ambitious,
    fit)</p>

    <p>Ren Larana: Xenobiologist attempting to revive an ancient xeno found
    frozen but alive within the ice, despite Hegemonic law forbidding it.
    Currently trying to sneak the xeno off-world. (bold, brilliant,
    confident)</p>

    <p>Raf Urich: Ice pirate, currently stranded on planet. Used his ship
    weapons to cut a berth in the ice. Has been hiding out, stealing parts to
    repair his ship. (experienced, cautious, shrewd)</p>
  rule: >-
    When you explore the ice palaces, you must make a Resolve Resist if you
    don't want to heed the echoes urging you to wander into the frozen wastes.
