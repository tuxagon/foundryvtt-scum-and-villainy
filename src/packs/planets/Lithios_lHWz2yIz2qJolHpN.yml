system:
  description: >-
    Ancient ice palaces dot the surface of this frozen planet, but the race to
    which they belong has long since passed. Entry to the palaces has been
    restricted after a string of mysterious deaths. Orbital mirrors shine like
    artificial suns, keeping a few larger settlements warm and powering large
    mining rigs for extracting water and liquefied gasses.
