    <p>Zo O Yun Ta Ri: Xeno weapons dealer known for prototypes and specialty
    armaments. Recently acquired an Ur ship weapon and plans to auction it under
    the cover of a storm. (xeno, connected, cautious, meticulous)</p>

    <p>Pasha "The Roc" Lensarr: Local Ashen Knives head. Known for a brutal
