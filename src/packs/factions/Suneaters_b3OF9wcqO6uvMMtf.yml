name: Suneaters
type: faction
system:
  description: >-
    Ur-archaeologists and scientists obsessed with recreating jumpgate
    technology. Looking to extinguish a star in pursuit of their goals.
  visible: true
  type: Weirdness
  tier: '4'
  goal: Devour Iota-2 and store energy
  turf: An Ur ruin on Lithios (HQ). Several Nightfall-based warehouses.
  assets: >-
    A few well-armed, unmarked ships. Armed troops. Mystics painfully trained to
    Way-bend gravity. Parts to build a jumpgate with activated Ur beacon. Solar
    siphon.
  quirks: >-
    Suneaters spend most of their days handling Ur artifacts and have all
    learned how to handle them safely.
  notables: |-
    <p>Elil (astrophysicist, fanatic, brilliant).</p>
    <p>Ruba (archaeologist, mystic, seer).</p>
    <p>Racel (engineer, loyal, conflicted).</p>
    <p>Rygar Z'tann (mystic, guard, gravity bender).</p>
  allies: Ghosts
  enemies: Sah'iir
  situation: >-
    Many are ex-Guilders or mystics, who have poured decades of money and study
    into their cause. If successful in their mission to mine Iota-2 for energy,
    the Hegemon would instantly grant the Suneaters Guild status, even if
    everyone in Iota perishes. The Suneaters consider it worth the risk.
