name: Turner Society
type: faction
system:
  description: >-
    A Holt-based Syndicate running drug dens masquerading as society houses.
    Their drugs are cooked with rare Aketi animal parts and Vosian crystals,
    which they sometimes have trouble sourcing.
  visible: true
  type: Criminal
  tier: '2'
  goal: Find new hunting grounds on Aketi
  turf: >-
    The Jewel, a society house on Mem (HQ). Wildside, a society house on
    Sonhandra. The Mirror Maze, an upscale club on Warren.
  assets: >-
    Vosian crystals and Aketi animals used to produce Haze. Several society
    houses. An intrasystem shuttle.
  quirks: >-
    Membership into the society is both exclusive and expensive, and considered
    a mark of taste amongst high society.
  notables: |-
    <p>Madam Gourdan (administrator, charming, connected).</p>
    <p>Pytric (chemist, callous, reclusive).</p>
    <p>Vallis (minor Noble, addicted, wealthy).</p>
    <p>Chorrguth (xeno, hunter, surly).</p>
  allies: House Malklaith
  enemies: Vigilance
  situation: >-
    Focusing on the upper echelon of Procyon, the Society has traded the typical
    complications of running drugs for new problems. Their unique drug requires
    Vosian crystals and Aketi animals, and with the Vigilance harassing their
    production, they struggle to keep up with demand.
