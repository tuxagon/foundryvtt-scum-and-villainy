name: Wreckers
type: faction
system:
  description: >-
    Scavengers and thieves with a few brilliant hackers, who incite factions to
    fight so that they may pick the battlefields clean later.
  visible: true
  type: Criminal
  tier: '1'
  goal: Repair the Derelict-8
  turf: Makeshift base inside a derelict ship near Baftoma (HQ).
  assets: >-
    A series of fake transponders, booby traps, and mock ships used to lure in
    unsuspecting marks. The Derelict-8, a derelict frigate they found after a
    battle between Draxler's Raiders and the Legion.
  quirks: >-
    Wreckers pick members from folks already fleeing from someone or hiding in
    Baftoma. They often trade air and water as a means of scoping folks out.
  notables: |-
    <p>Bobby-O (wizard-class hacker, arrogant, trickster).</p>
    <p>Meshkilarn (mechanic, muscled, grimy).</p>
    <p>Qord (xeno, thief, delicate, one-handed).</p>
  allies: Borniko Syndicate
  enemies: Draxler's Raiders, Echo Wave Riders
  situation: >-
    The crew has hit several targets in the system by sowing confusion between
    the Rin factions, and cleaning up after pirates. Their goal is to salvage
    enough to repair their current home, the ship they call the Derelict-8. To
    do that, many more ships are going to need to be destroyed.
