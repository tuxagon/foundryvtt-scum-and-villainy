name: Hegemonic News Network
type: faction
system:
  description: >-
    Those who control the media control the mind. Often use this as leverage
    over other factions. Spies.
  visible: true
  type: Hegemony
  tier: '2'
  goal: Find blackmail on Governor Malklaith
  turf: HNN Corporate Offices on Warren (HQ). Field offices on every planet.
  assets: Sector-wide communications. Many independent journalists feeding them news.
  quirks: >-
    The bulk of the HNN's workforce are contractors, selling HNN stories they
    find. Many reporters are also trained spies.
  notables: >-
    <p>Cinszo (owner, ambitious, greedy, untrustworthy).</p>

    <p>Rinsama Kay (chief editor, cynical, demanding, stickler).</p>

    <p>Ooxoo (xeno, press pool manager, curious).</p>

    <p>Stacy Weathers (ace reporter, trained spy, always grinning, nose for
    trouble).</p>
  allies: Starless Veil
  enemies: Dyrinek Gang, Mendicants
  situation: >-
    The HNN is effectively the private intelligence agency of Cinszo. The
    director leverages information coming into the network to blackmail and
    influence the powerful in the sector. Cinszo has had a taste of the
    high-life and is looking to find a way into a Noble House, by marriage or
    appointment.
