name: Janus Syndicate
type: faction
system:
  description: >-
    Weapons dealers that specialize in ship weapons, headed up by the ruthless
    Viktor Bax, who insists on doing the first deal with every client in person.
  visible: true
  type: Criminal
  tier: '2'
  goal: Acquire source for capital weapons
  turf: >-
    Weapons camp on Sonhandra (HQ). A sizable operation at Aketi's Base Camp
    One.
