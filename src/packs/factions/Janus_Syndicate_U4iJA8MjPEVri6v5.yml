    A large stockpile of weapons, particularly ship weapons. Several small but
    well-armed ships. A map of the current dark hyperspace lanes.
  quirks: >-
    Viktor Bax insists on meeting every client the Syndicate does business with
    in person.
  notables: |-
    <p>Viktor Bax (ambitious, charming, distrustful, ruthless).</p>
    <p>Baruk (xeno, bodyguard, huge).</p>
    <p>Wendel (nervous, technical, loyal).</p>
    <p>Faye Null (unmarked Yaru, pilot, adventurous, foolhardy).</p>
  allies: Draxler's Raiders
