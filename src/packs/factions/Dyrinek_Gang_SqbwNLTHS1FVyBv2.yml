name: Dyrinek Gang
type: faction
system:
  description: >-
    Mostly young, disenfranchised xenos who have turned to crime and found
    strength and solidarity with each other. Based on Warren but looking to
    expand  wherever there are other like-minded folks.
  visible: true
  type: Criminal
  tier: '1'
  goal: Take over HNN broadcast on Warren
  turf: >-
    Lost Paradise, a club with an attached warehouse where the gang does its
    business (HQ).
  assets: >-
    A collection of high-end hoverbikes used to cruise through their territory.
    A few minor artifacts some of the leaders have attached to themselves.
  quirks: >-
    When a new member joins the gang, they all go out on a drunken tear across
    the city, leaving a swath of wreckage in their wake.
  notables: |-
    <p>Dyrinek (xeno, revolutionary, proud).</p>
    <p>Burn (Memish mystic, xeno, fast, overconfident, untrained).</p>
    <p>Radds (human, hacker, smart).</p>
    <p>Myrk (xeno, gun enthusiast, hothead).</p>
  allies: Cobalt Syndicate
  enemies: Hegemonic News Network, House Malklaith
  situation: >-
    The gang has had its run-ins with System police and the HNN paints them as
    lowlifes with no future. Dyrinek wants to send a message that they won't be
    so easily dismissed, and plans to take over the airwaves to broadcast the
    gang's punk ideology. All they need is the opportunity.
