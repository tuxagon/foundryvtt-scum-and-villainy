name: Scarlet Wolves
type: faction
system:
  description: >-
    Although they often hire themselves out as bounty hunters, the Scarlet
    Wolves are a renowned group of assassins. Each bears a distinctive tattoo of
    a wolf holding a star in its mouth.
  visible: true
  type: Criminal
  tier: '4'
  goal: Murder top Guild engineers
  turf: >-
    The Killroom, a high-end safe house on Warren (HQ). Holdouts on most
    planets.
  assets: >-
    A large armory of the very best weapons. An actual huge wolf genetically
    engineered by the Yaru as payment. (Rik keeps it. They feed it others who
    don't pay.)
  quirks: >-
    Each member of the Wolves bears a distinctive tattoo of a wolf holding a
    star in its mouth.
  notables: |-
    <p>Rik "Old Wolf" Urus (leader, dangerous, retired, cunning).</p>
    <p>Hara "Mamba" M'brozz (sniper, killer, thrill-seeker).</p>
    <p>Jet "Shark" Wolffe (aloof, confident, unforgiving).</p>
  allies: None. With the Wolves it's strictly business.
  enemies: Starless Veil, Vignerons
  situation: >-
    The Scarlet Wolves are contract killers specializing in hard targets. They
    have a reputation for delivering, minimizing collateral, and never taking
    bribes. They've taken a large contract from the Counters Guild to kill a
    number of the Guild of Engineers' heads, but need time to set up the hit.
