name: (Mu) Xeno
type: ability
system:
  description: >-
    You may spend Stress (0-2) to perform an inhuman feat only members of your
    species can do. (See page 296)

    From Worf to D'Argo to Chewbacca, aliens mighty in a fight have been a
    staple of the space opera genre. The Muscle's starting ability is
    significant, but many xenos have strength far beyond that of a normal human.
    Some may have more limbs, or adaptations for harsh environments. Consider
    how your xeno heritage might make you a more useful Muscle, and talk with
    your table about how you want to use your Xeno ability.
