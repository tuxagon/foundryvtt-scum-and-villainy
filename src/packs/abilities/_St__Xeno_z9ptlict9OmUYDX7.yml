_id: z9ptlict9OmUYDX7
name: (St) Xeno
type: ability
system:
  description: >-
    You may spend Stress (0-2) to perform an inhuman feat only members of your
    species can do. (See page 296)

    There are numerous species with a knack for medical science and enhanced
    senses that render a medical scanner unnecessary. Think about how you might
    approach healing differently than a human doctor. Perhaps you're unused to
    species with a single heart. Or find it annoying that others can't just
    regenerate limbs like your people can. Embrace and celebrate the
    differences. Regardless of the species, most physicians are at least
    superficially well treated in Procyon; you're less likely to have problems
    than other xenos.
