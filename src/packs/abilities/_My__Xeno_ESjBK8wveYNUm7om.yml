name: (My) Xeno
type: ability
system:
  description: >-
    You may spend Stress (0-2) to perform an inhuman feat only members of your
    species can do. (See page 296)

    The sector is rife with species that are uniquely attuned to the Way. Some
    claim ancestry to the Ur, while others claim evolution on a Way-ridden
    planet. Regardless, as a xeno Mystic, you're giving up a key starting
    ability and should consider how it influences your development as a Mystic.
    Work with your GM and table to define special abilities and permissions for
    the specific mystic tradition of your people.
