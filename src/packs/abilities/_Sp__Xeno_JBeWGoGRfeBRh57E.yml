name: (Sp) Xeno
type: ability
system:
  description: >-
    You may spend Stress (0-2) to perform an inhuman feat only members of your
    species can do. (See page 296)

    Aside from diplomats, xeno Speakers are somewhat unusual in the Hegemony.
    Amongst the Syndicates, xenos are far more accepted and in some, even
    preferred. Space adventure has plenty of examples of natural empaths,
    species with advanced cognitive functions, or even protocol robots that
    serve as Speakers for their crew. When considering your xeno heritage, think
    about how your species communicates and work with your GM to figure out how
    those styles of communication might manifest in play.
