name: (Sc) Xeno
type: ability
system:
  description: >-
    You may spend Stress (0-2) to perform an inhuman feat only members of your
    species can do. (See page 296)

    Scoundrels are often audience-inserts, representing an "ordinary person." A
    xeno Scoundrel is an exercise in humanizing the Other and making the unusual
    characters of Procyon approachable. Think about your culture and people when
    making your xeno. Do your stodgy people accept your disregard for the rules?
    Are they welcomed in Hegemonic society or are they on the fringe of
    acceptability themselves? Are they from Procyon or elsewhere in the galaxy?
