# ⚠ DO NOT DISPATCH ⚠
# This workflow reads YAML pack sources from `src/packs/`, which no longer
# exists — pack sources have moved to `packs/_source/`. Running this workflow
# in its current form will fail at the "Build Compendium Packs" step. It will
# be replaced wholesale by `release.yml` in an upcoming commit. Until then,
# do not click "Run workflow" on this file.
#
# GitHub Actions workflow for creating a FoundryVTT system release.
#
# Trigger: manual only. Run from Actions -> "Create Module Files For GitHub
# Release" -> Run workflow, pick a branch, supply a version like "1.7.0", and
# click Run. The workflow builds the compendium packs from src/packs/, fills
# in system.json with version + URLs derived from the tag it is about to
# create, zips system.json + system.zip, then creates (or updates) a tag and
# GitHub release on the chosen commit and attaches both files as assets.
#
# The release is marked as the latest release, so the manifest URL Foundry
# resolves remains stable:
#   https://github.com/<owner>/<repo>/releases/latest/download/system.json
#
# Useful References:
#   - https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
#   - https://docs.github.com/en/actions/learn-github-actions/contexts
#   - https://github.com/ncipollo/release-action
#
name: Create Module Files For GitHub Release


env:
  # The URL used for the system's "Project URL" link in Foundry's system list.
  project_url: "https://github.com/${{ github.repository }}"

  # A URL that always points to the latest manifest. Foundry uses this URL
  # to check whether the installed system version is current, so it MUST NOT
  # change between releases.
  latest_manifest_url: "https://github.com/${{ github.repository }}/releases/latest/download/system.json"


on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.7.0 - leading 'v' optional)"
        required: true


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.1.6

      # Set up Node so we can build the compendium LevelDB packs from the
      # YAML sources committed under src/packs/.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Install dev dependencies (foundryvtt-cli) without running postinstall,
      # which would also try to build symlinks and packs locally. We invoke
      # `npm run pack` explicitly in the next step.
      - name: Install Dependencies
        run: npm ci --ignore-scripts

      # Build packs/<name>/ LevelDB databases from src/packs/<name>/*.yml so
      # the zip step below picks them up.
      - name: Build Compendium Packs
        run: npm run pack

      # Normalize the version input and derive a tag.
      # - Input "1.7.0" or "v1.7.0" both yield version=1.7.0 and tag=v1.7.0.
      - name: Compute Version and Tag
        id: vt
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"

      # Modify "system.json" with values specific to this release. The
      # placeholders #{...}# in the committed system.json are replaced in
      # place on the runner; the change is NOT committed to the repo.
      - name: Modify System Manifest With Release-Specific Values
        uses: cschleiden/replace-tokens@v1
        with:
          files: 'system.json'
        env:
          VERSION: ${{ steps.vt.outputs.version }}
          URL: ${{ env.project_url }}
          MANIFEST: ${{ env.latest_manifest_url }}
          DOWNLOAD: "https://github.com/${{ github.repository }}/releases/download/${{ steps.vt.outputs.tag }}/system.zip"

      # Create the system.zip archive containing all files Foundry needs at
      # runtime. If you add new top-level directories that should ship with
      # the system, add them here.
      - name: Create System Archive
        run: |
          zip                                    \
            `# Options`                          \
            --recurse-paths                      \
            `# The name of the output file`      \
             ./system.zip                        \
            `# The files that will be included.` \
            system.json                          \
            template.json                        \
            README.md                            \
            LICENSE.txt                          \
            CHANGELOG.txt                        \
            templates/                           \
            module/                              \
            styles/                              \
            packs/                               \
            themes/                              \
            lang/

      # Create (or update) the tag and GitHub release on the chosen commit,
      # attach system.json + system.zip, and mark it as the latest release so
      # the manifest URL above resolves to this build.
      #
      # - allowUpdates: re-running with the same version updates the release
      #   in place instead of failing.
      # - commit: pins the new tag to the exact SHA this workflow ran against.
      - name: Create GitHub Release with Assets
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          tag: ${{ steps.vt.outputs.tag }}
          name: ${{ steps.vt.outputs.tag }}
          commit: ${{ github.sha }}
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: './system.json, ./system.zip'
