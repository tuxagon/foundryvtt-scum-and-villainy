      content: >-
        <p>A detective presents a case file of evidence to a judge, to begin
        prosecution of your crew. The system police send a detail to arrest you
        (a gang at least equal in <strong>scale</strong> to your <strong>Wanted
        Level</strong> or a ship of that Tier). Pay them off with
        <strong>Cred</strong> equal to your <strong>Wanted Level</strong> +3,
        hand someone over for arrest (this clears your <strong>Heat</strong> and
        <strong>Wanted Level</strong> in the system), or try to evade
        capture.</p>
