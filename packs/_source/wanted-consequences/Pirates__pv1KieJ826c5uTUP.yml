      content: >-
        <p>Pirates attempt to take over your ship by force. Outrun, fight, or
        cut a deal. If you didn’t use your ship at all on the last job, you
        avoid entanglements right now.</p>

        <p>This entanglement can happen while in flight between planets or
        systems, or on the way to or from a job.</p>
