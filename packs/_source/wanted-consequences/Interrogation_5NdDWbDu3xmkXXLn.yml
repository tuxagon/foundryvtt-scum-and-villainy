      content: >-
        <p>System officers round up one of the PCs to question them about the
        crew’s crimes. How did they manage to capture you? Either pay them off
        with 2 <strong>Cred</strong>, or they sweat it out of you (level 2
        <strong>Harm</strong>) AND you tell them what they want to know (+2
        <strong>Heat</strong> ). You can resist each of those consequences
        separately.</p>
