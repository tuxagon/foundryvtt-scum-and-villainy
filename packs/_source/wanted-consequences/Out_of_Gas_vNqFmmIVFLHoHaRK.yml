    text:
      format: 1
      content: >-
        <p>A piece of your ship fails catastrophically, damaging the system and
        rendering it inoperable until repaired. If you didn’t use your ship at
        all on the last job, you avoid entanglements right now.</p>

        <p>This entanglement can happen while in flight between planets or
        systems, or on the way to or from a job. This failure means the whole
        system (for example, engines) can’t be used. Who do you call for help
        and what will it cost you?</p>
