  scene: >-
    Massive, person-sized flowers blooming along a vine-supported path through
    the trees. The sweet smell of honey floating through the air. Scientists and
    managers taking lunch at treetop cafes while reviewing project schedules.
    Sick pilgrims praying for a cure while waiting to travel to the old
    Mendicant temple deep in the forests.
  notables: >-
    <p>Yon Lirak: High-end drug dealer. Runs a factory in Rost that never shuts
    down, producing synthetic narcotics for several major species. (experienced,
    ruthless, unforgiving)</p>

    <p>Ara Blaze: Once a star athlete, now a preeminent pit fighter in the
    underground fight clubs. Ara has tried every performance-enhancing drug
    offered to her, and it has changed her. (ruthless, unforgiving,
    engineered)</p>

    <p>Uyen al'Vorron: Famous Noble duelist from the religious House Vorron.
    Seeking to cultivate a plant for a new vineyard he's planning to grow on a
    moon near the Core. (armed, deadly, observant)</p>
  rule: >-
