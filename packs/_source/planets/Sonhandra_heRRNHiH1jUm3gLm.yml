  scene: >-
    Perpetual twilight amid paved streets and concrete buildings. Howling of
    frequent wind storms. Masked and cloaked strangers congregating around a
    steel warehouse before an auction begins. Row after row of ships landed in
    the open dirt on the outskirts of Ugar.
  notables: >-
    <p>Del Hex: Outlaw and gunslinger. Has some obvious cybernetics from his
    Guild days. Wanted in several systems. Runs a vibro-weapon fighting ring
    deep in the day side. (ruthless, fast, cautious)</p>

    <p>Abra Drake: Fixer for hire and auctioneer. If she can't get it or sell
    it, she knows someone who can. (connected, confident, bold)</p>

    <p>Zaeed "Tank" Marak: Mercenary turned Nyct farmer. Knows where and how to
    hide ships on the night side. (gambler, commanding, experienced)</p>

    <p>Osha: Nyct-smoking, grizzled ex-Legionnaire. Runs the Three Suns, a
    gambling den and the biggest local dive. (deadly, retired, steely)</p>
  rule: >-
    Everything is available here for a price. You can always take +1d to Acquire
    Assets, but on a 1-3, the asset also comes with strings.
