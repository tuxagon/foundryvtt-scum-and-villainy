name: Sonhandra
type: planet
img: systems/scum-and-villainy/styles/assets/planets/Sonhandra.webp
system:
  description: >-
    This planet is tidally locked: the same side of the planet faces the star at
    all times. Oddly, all light sources extinguish about a kilometer into the
    night side. Most of the settlements are in the twilight border zone,
    including the capital city of Ugar. Known for its lax policies regulating
    trade, it's become a choice destination for smugglers and fences alike.
