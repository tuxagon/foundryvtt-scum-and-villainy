  notables: >-
    <p>Saren Galia: Data broker and bookie. When you can't pay your debts, you
    become her informant. (paranoid, fast, connected)</p>

    <p>Lotus: Fashionista and taste-maker, dressed in elaborate costumes.
    Secretly a high-powered fixer. Has been known to take charity cases when the
    cause appeals to her. (popular, passionate, meticulous)</p>

    <p>Jet Wolffe: Scarlet Wolves assassin. Can be hired for the right price,
    but only takes off-world jobs. Travels with a large, blue-skinned alien
