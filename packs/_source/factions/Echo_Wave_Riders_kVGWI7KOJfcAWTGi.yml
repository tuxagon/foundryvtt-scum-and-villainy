name: Echo Wave Riders
type: faction
system:
  description: >-
    Pilots. Many organize illegal races. Many take dangerous jobs for pay, and a
    few test dangerous new engine/flight technologies for the Guild. They wear a
    pin that shows how many races they've won.
  visible: true
  type: Criminal
  tier: '2'
  goal: Organize system-wide race in Brekk
  turf: >-
    A secluded hanger on Nightfall (HQ). A near permanent presence at Bright
    Wind in Brekk.
  assets: >-
    A host of ships of their own, and access to far more. Substantial mechanical
    facilities on Nightfall.
  quirks: >-
    Echo Wave Riders don't respect those who don't know how to pilot their own
    ship, and settle all scores with races.
  notables: |-
    <p>Garge Ztar (risk-taker, ambitious, charismatic).</p>
    <p>Elen (engineer, analytical, race-winner).</p>
    <p>Inofra (stunt pilot, compassionate, veteran).</p>
    <p>Dom (ex-Starsmith, mechanic, genius, family man, lives to race).</p>
  allies: Borniko Syndicate, Starsmiths Guild
  enemies: Wreckers
  situation: >-
    The Riders are left alone by authorities if their races are kept far enough
    from civilization (and claiming Bright Wind takes care of that). They plan
    to put on an epic race among system pilots for prestige and cash prizes,
    starting and ending in the plasma cloud. Buy-in will be expensive.
