name: House Malklaith
type: faction
system:
  description: >-
    A powerful Noble House of the Hegemony, ostensibly owns the sector.
    Represented by the Governor, who lives on Warren.
  visible: true
  type: Hegemony
  tier: '3'
  goal: Acquire Aleph Key
  turf: >-
    Malklaith owns the sector, but the Governor rarely leaves Warren. His people
    can be found in major positions in every system of the sector.
  assets: >-
    Procyon sector taxes, generating vast coffers. A growing collection of
    Precursor artifacts.
  quirks: >-
    Governor Malklaith wears a number of strange rings of Precursor origin:
    their powers are not fully known, even to him.
  notables: |-
    <p>Governor Ritam al'Malklaith (Noble, intense, obsessed, well-spoken).</p>
    <p>Jerrem (guard captain, tactical, scarred, loyal).</p>
    <p>Shim (judge, corrupt, greedy, ambitious).</p>
  allies: 51st Legion, Nightspeakers, Turner Society
  enemies: The Agony, Ashen Knives, Lost Legion, The Maelstrom
  situation: >-
    Disgraced after a famous duel, Governor Malklaith is convinced the way to
    regain his rightful place is by gathering Precursor secrets (Nightspeaker
    Doraam whispers this in his ear regularly). He hopes this will give him the
    edge in the cloak and dagger world of imperial politics; this pursuit is
    highly illegal.
