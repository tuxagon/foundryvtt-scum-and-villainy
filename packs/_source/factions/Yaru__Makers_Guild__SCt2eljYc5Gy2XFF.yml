name: Yaru (Makers Guild)
type: faction
system:
  description: >-
    Guild that force-grows clones for labor. Clones are short-lived, have a
    symbol on their foreheads, and are supposedly only barely sentient. Folks
    are distinctly uncomfortable around the clones.
  visible: true
  type: Hegemony
  tier: '2'
  goal: Breed clone soldiers for Lost Legion
  turf: Sanctioned Yaru creche on Lithios (HQ). Secret research facility on Amerath.
  assets: >-
    Cloning facilities. Clones placed in several important households and
    facilities, which report back. Powerful capacity for genetic manipulation.
  quirks: >-
    The Makers Guild doesn't accept new members. The progenitors have
    self-perfected and are frozen; only so many are allowed to be active at
    once. The Yaru (as the clones are called) make many people in their presence
    uneasy.
  notables: |-
    <p>Foler Atherton (biologist, concealed).</p>
    <p>Bal Yn (geneticist, haughty).</p>
    <p>Rech (savant, cold).</p>
    <p>All unmarked progenitor clones.</p>
  allies: Lost Legion
  enemies: Cobalt Syndicate
  situation: >-
    When the Hegemon ascended, the Yaru sided with a competitor and their
    numbers, strictly regulated by the Hegemon, have been severely reduced.
    Unsatisfied, they have thrown in with the Lost Legion and are secretly
    working to restore the previous Hegemon to power.
