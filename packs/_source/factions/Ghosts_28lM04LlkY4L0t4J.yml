name: Ghosts
type: faction
system:
  description: >-
    Scientists who, due to a mishap, live exo-suited in a half-phased state. The
    Church of Stellar Flame offers a significant bounty on them and their ghost
    ship, the Skeleton Key, dead or destroyed (but certainly not alive).
  visible: true
  type: Weirdness
  tier: '2'
  goal: Hire Memish to make bomb for Holt Gate
  turf: >-
    The Skeleton Key, a half-phased corvette (HQ). A secret research facility on
    Lithios.
  assets: >-
    A corvette that can travel along Way lines. The ability to phase on top of
    people, possessing them, though the body dies a few days later.
  quirks: >-
    Before the mishap, the Ghosts were scientists. All are intelligent and
    educated. They phase out of reality if too long outside their suits (or
    people).
  notables: |-
    <p>Nils Boyer (physicist, brilliant, remorseful).</p>
    <p>Roy Stanz (biologist, bitter, driven).</p>
    <p>Eegon Mark (engineer, genius, suit designer).</p>
    <p>Pol Venker (engineer, self-indulgent, cavalier).</p>
  allies: Ashtari Cult, Suneaters
  enemies: Church of Stellar Flame, Cult of the Seekers
  situation: >-
    A mishap with the Holt gate phased the Ghosts. Upon their return, they
    possessed those that boarded. The Hegemony has been hunting them since.
    Recently their exo-suits have allowed them to act without harming others.
    They theorize that destroying the Holt gate will restore them to their
    original forms.
