name: (P) Xeno
type: ability
system:
  description: >-
    You may spend Stress (0-2) to perform an inhuman feat only members of your
    species can do. (See page 296)

    Xeno Pilots are usually associated with xeno ships. If you pursue the
    option, ask your GM about modifications that you might be able to make to
    your ship, or unusual upgrades your people might have access to. When
    developing your people, think of ways their piloting might be affected by
    having uncommon senses (perhaps they can see gravity or other spectrums), or
    unique ways of interfacing (such as direct neural connections).
